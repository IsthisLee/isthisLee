name: Run Claude Task Example

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 1. [필수] OIDC 권한 설정
permissions:
  id-token: write
  contents: read

jobs:
  run-claude:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # 2-1. GitHub OIDC 토큰 발급
      - name: Get GitHub OIDC Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setOutput('token', token);

      # 2-2. Anthropic 임시 액세스 토큰으로 교환
      - name: Get Anthropic Access Token
        id: anthropic_auth
        run: |
          JWT="${{ steps.oidc.outputs.token }}"
          
          RESPONSE=$(curl -sSf https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<EOF
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_011Pp7b6wsaz4Z3w4NQpeR6B",
            "organization_id": "341c687c-5d22-4965-a69e-64e5f7f3d74b",
            "service_account_id": "svac_01FoKyRVLhGpcvzhXCqCGrXm",
            "workspace_id": "wrkspc_01Mt9eeGpB2xs6zbdNJfP2ju"
          }
          EOF
          )
          
          # 발급된 임시 토큰 추출 및 마스킹 처리
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      # 3. 교환한 토큰으로 Claude API 호출 또는 자동화 스크립트 실행
      - name: Call Claude API
        run: |
          curl https://api.anthropic.com/v1/messages \
            -H "Authorization: Bearer ${{ steps.anthropic_auth.outputs.access_token }}" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{
              "model": "claude-3-5-sonnet-20241022",
              "max_tokens": 1000,
              "messages": [{"role": "user", "content": "코드 리뷰 또는 자동화 작업을 수행해줘."}]
            }'
