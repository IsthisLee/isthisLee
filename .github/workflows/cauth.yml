name: Anthropic Workload Identity Test

on:
  workflow_dispatch: # Actions 탭에서 수동으로 즉시 실행하기 위한 트리거
  push:
    branches: [ main ]

# OIDC 연동을 위한 필수 권한 설정
permissions:
  id-token: write # GitHub OIDC 토큰을 발급받기 위해 반드시 필요
  contents: read  # 저장소 코드 체크아웃용

jobs:
  test-oidc-token:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: GitHub OIDC 토큰 발급
        id: get_token
        uses: actions/github-script@v7
        with:
          script: |
            // Anthropic에서 요구하는 특정 Audience가 있다면 괄호 안에 입력합니다. (예: 'anthropic.com')
            // 비워둘 경우 기본적으로 저장소 URL이 Audience로 지정됩니다.
            const token = await core.getIDToken();
            core.setOutput('id_token', token);

      - name: 발급된 토큰으로 인증 테스트
        env:
          WORKLOAD_ID: "fdis_01UxPwDAw8CYMdmJNGqhMwaL" # 캡처 이미지의 발급자 ID
        run: |
          echo "OIDC 토큰 발급 완료 (보안상 자동 마스킹 처리됨): ${{ steps.get_token.outputs.id_token }}"
          
          # -------------------------------------------------------------------
          # 아래는 토큰을 사용해 Anthropic API와 통신하는 예시입니다. 
          # 실제 Anthropic 워크로드 아이덴티티 API 규격에 맞춰 엔드포인트와 헤더를 수정하세요.
          # -------------------------------------------------------------------
          # curl -X POST "https://api.anthropic.com/v1/..." \
          #   -H "Authorization: Bearer ${{ steps.get_token.outputs.id_token }}" \
          #   -H "x-workload-id: $WORKLOAD_ID"
