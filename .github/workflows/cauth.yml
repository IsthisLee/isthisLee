name: Anthropic OIDC Token Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  exchange-token:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: GitHub OIDC 토큰 발급
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setOutput('token', token);

      - name: Anthropic 액세스 토큰으로 교환 테스트
        run: |
          JWT="${{ steps.oidc.outputs.token }}"
          
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<EOF
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_011Pp7b6wsaz4Z3w4NQpeR6B",
            "organization_id": "341c687c-5d22-4965-a69e-64e5f7f3d74b",
            "service_account_id": "svac_01FoKyRVLhGpcvzhXCqCGrXm",
            "workspace_id": "wrkspc_01Mt9eeGpB2xs6zbdNJfP2ju"
          }
          EOF
